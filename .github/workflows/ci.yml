name: CI

on: [push, pull_request]

jobs:
  test:
    name: "Test: Debian trixie"
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Install Debian packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            python3 \
            python3-django \
            python3-pil \
            python3-psycopg2 \
            python3-pytest \
            python3-pytest-cov \
            python3-pytest-django \
            python3-reportlab
      - uses: actions/checkout@v7
      - run: cp itkufs/settings/local.py.template itkufs/settings/local.py
      - name: Check for missing migrations
        run: python3 manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python3 -m pytest --cov=itkufs --cov-report=term-missing

  lint:
    name: "Lint: Debian trixie"
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Install Debian packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            black \
            ca-certificates \
            flake8 \
            git
      - uses: actions/checkout@v7
      - name: Check formatting
        run: black --check itkufs
      - name: Lint
        run: flake8 --show-source --statistics itkufs
